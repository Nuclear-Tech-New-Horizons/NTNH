name: Sync to Server Repo

on:
  # Trigger only when a release is published on main
  release:
    types: [published]
  # Allow manual trigger for testing or emergency sync
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to NTNH-Server
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          # Clone the server repository
          git clone https://x-access-token:${{ secrets.UNIVERSAL_FINE }}@github.com/NTNewHorizons/NTNH-Server.git server-repo

          # Remove auto-synced directories in the server repo to ensure clean state
          cd server-repo
          git rm -r --ignore-unmatch mods config scripts serverutilities 2>/dev/null || true
          cd ..

          # Copy everything from the client repo except excluded paths
          rsync -av --delete \
            --exclude='.git/' \
            --exclude='server/client-only.txt' \
            --exclude-from='server/client-only.txt' \
            ./ server-repo/

          # Commit and push changes to the server repository
          cd server-repo
          git add -A
          git diff --cached --quiet || git commit -m "sync: release ${{ github.event.release.tag_name }} from NTNH main"
          git push origin main
